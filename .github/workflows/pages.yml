name: Publish dashboard to gh-pages

# GitHub Pages serves the gh-pages branch. Every change to site/ on main is copied there,
# so the live dashboard always matches the committed build.
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
  workflow_call:   # the scheduled data refresh calls this after committing a new build

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # after a refresh commit, publish the newest build, not the triggering one
      - name: Copy site/ to the gh-pages branch
        run: |
          set -e
          cp -r site "$RUNNER_TEMP/site"
          git config user.name "Milad Shabani"
          git config user.email "milad.shabani6515@gmail.com"
          git fetch origin gh-pages || true
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git switch -c gh-pages origin/gh-pages
          else
            git switch --orphan gh-pages
          fi
          git rm -rq --ignore-unmatch . || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r "$RUNNER_TEMP/site/." .
          touch .nojekyll
          git add -A
          if git diff --cached --quiet; then echo "gh-pages already up to date"; exit 0; fi
          git commit -m "Publish dashboard from ${GITHUB_SHA::7}"
          git push origin gh-pages
