name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Rebuild everything from the committed raw data
        run: |
          python scripts/run_pipeline.py
          python scripts/build_dashboard.py
      - name: Install browser test driver
        run: pip install playwright==1.62.0
      - name: Run data and offline dashboard tests
        run: |
          chrome_path=$(command -v google-chrome)
          HOUSING_TEST_CHROME="$chrome_path" pytest -q
