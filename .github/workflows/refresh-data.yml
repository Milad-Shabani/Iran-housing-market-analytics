name: Refresh Divar data

# Validates Tehran and selected cities independently, then rebuilds and publishes accepted snapshots.
# Scheduled on the default branch. Set DATA_REFRESH=off to pause scheduled collections.
# REFRESH_RUNNER can select an existing self-hosted runner with access to Divar.

on:
  schedule:
    - cron: "17 3 * * 5"   # Fridays 03:17 UTC (06:47 Tehran)
  workflow_dispatch:
    inputs:
      publish:
        description: Publish accepted data to the public site (off for a test run)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name == 'workflow_dispatch' || vars.DATA_REFRESH != 'off'
    runs-on: ${{ vars.REFRESH_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 155
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect and validate Tehran
        id: tehran
        continue-on-error: true
        run: |
          if ! python -u scripts/collect_divar.py refresh --max-minutes 50 --max-requests 8000; then
            git restore -- data/raw/divar_1405
            echo "::warning::Tehran refresh rejected; last accepted data retained"
            exit 1
          fi
      - name: Collect and validate weekly city snapshots
        id: cities
        continue-on-error: true
        run: python -u scripts/collect_city_weekly.py
      - name: Verify at least one source refreshed
        if: steps.tehran.outcome != 'success' && steps.cities.outcome != 'success'
        run: |
          echo "::error::No source passed the refresh checks; previous site retained"
          exit 1
      - name: Rebuild analysis and dashboard
        run: |
          python scripts/run_pipeline.py
          python scripts/build_dashboard.py
      - run: pytest -q
      - id: commit
        if: github.ref_name == github.event.repository.default_branch && (github.event_name == 'schedule' || inputs.publish == true)
        name: Commit the refreshed data
        run: |
          git config user.name "Milad Shabani"
          git config user.email "milad.shabani6515@gmail.com"
          git add data/raw/divar_1405 data/raw/divar_weekly data/processed site
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "Refresh Divar data ($(date -u +%Y-%m-%d))"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

  publish:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: write
